<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>超级连接 · deepsleep</title>
<style>
  :root { --bg:#f5f5f7; --card:#fff; --fg:#1c1c1e; --sub:#6e6e73; --line:#e3e3e6; --pri:#0a84ff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1c1e; --card:#2c2c2e; --fg:#f2f2f7; --sub:#98989d; --line:#3a3a3c; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:22px;
         background:var(--bg); color:var(--fg);
         font:15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
  .wrap { width:520px; max-width:100%; }
  .logo { font-size:40px; text-align:center; }
  h1 { font-size:23px; text-align:center; margin:6px 0 4px; }
  .sub { text-align:center; color:var(--sub); font-size:13.5px; margin:0 0 22px; }
  .card { background:var(--card); border-radius:16px; padding:18px; margin-bottom:14px;
          box-shadow:0 8px 30px rgba(0,0,0,.08); }
  #pairBox { display:flex; gap:10px; }
  #code { flex:1; min-width:0; font:600 30px/1 ui-monospace, Consolas, monospace; letter-spacing:.22em;
          text-align:center; padding:14px 10px; border-radius:12px; border:1px solid var(--line);
          background:transparent; color:var(--fg); outline:none; }
  #code:focus { border-color:var(--pri); }
  button.pri, a.pri { background:var(--pri); color:#fff; border:0; border-radius:12px; padding:14px 20px;
          font-size:15px; font-weight:600; cursor:pointer; text-decoration:none; white-space:nowrap;
          display:inline-flex; align-items:center; justify-content:center; }
  button.pri:disabled { opacity:.5; }
  .status { color:var(--sub); font-size:13.5px; text-align:center; padding:10px 4px; }
  .status .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--pri);
          margin-right:7px; animation:blink 1.1s infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  .ok { font-size:16px; font-weight:600; }
  .btns { display:flex; flex-direction:column; gap:9px; margin-top:14px; }
  .btns a.ghost { border:1px solid var(--line); border-radius:12px; padding:13px 18px; text-align:center;
          text-decoration:none; color:var(--fg); font-weight:600; font-size:14.5px; }
  .hint { color:var(--sub); font-size:12.5px; margin-top:9px; }
  .foot { text-align:center; color:var(--sub); font-size:11.5px; margin-top:18px; line-height:1.7; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">🐋</div>
  <h1>超级连接</h1>
  <p class="sub">在另一台设备上也能用你的 deepsleep。<br>输入它显示的 6 位配对码就行，远程桌面也在里面。</p>

  <div class="card" id="pairBox">
    <input id="code" maxlength="6" inputmode="numeric" pattern="[0-9]*" placeholder="000000" autocomplete="off" spellcheck="false">
    <button class="pri" id="btnGo">连接</button>
  </div>

  <div class="status hidden" id="status"></div>

  <div class="card hidden" id="done">
    <div class="ok">✅ 已连上 <span id="peerName"></span></div>
    <div class="hint" id="modeHint"></div>
    <div class="btns">
      <a class="pri" id="linkRd" target="_blank" rel="noreferrer">🖥 打开远程桌面</a>
      <a class="ghost" id="linkFull" target="_blank" rel="noreferrer">💬 打开完整控制台</a>
    </div>
  </div>

  <p class="foot">配对码 5 分钟内有效；信令只用来交换地址，连上之后数据都在两台设备之间。<br>
     另一台设备：客户端点「超级连接 → 生成配对码」，或内核版输入「打开超级连接」。</p>
</div>
<script src="superlink.js"></script>
</body>
</html>
