<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deepsleep</title>

</head>
<body class="light">
<div id="app">

  <!-- 自绘标题栏（36px）之上是客户端区域，这里画 macOS 顶部工具条 -->
  <header id="topbar">
    <!-- 集群标签页已撤掉：拆分任务改由主助手自己完成（「拆分任务」工具），
         不再需要用户手动切到另一个标签页去拼一个团队。 -->
    <div class="seg" id="seg">
      <button data-tab="0" class="on">AI 助手</button>
    </div>
    <div class="tb-right">
      <button id="btnModel" class="pill" title="切换模型（列表联网获取，不用去设置里翻）">🧠 <span id="modelText">模型</span></button>
      <button id="btnUpdate" class="pill hidden">⬆ <span id="updateText">检查更新</span></button>
      <button id="btnTheme" class="icon" title="深浅色">🌙</button>
      <button id="btnLink" class="icon" title="超级连接（配对码 / 远程桌面）">🔗</button>
      <button id="btnSettings" class="icon" title="设置">⚙</button>
    </div>
  </header>

  <div id="main">
    <aside id="sidebar">
      <div class="side-top">
        <input id="convSearch" type="text" placeholder="搜索对话">
        <button id="btnNew" class="round" title="新建对话">＋</button>
      </div>
      <div id="convList" class="scroll"></div>
      <div class="side-bottom">
        <button id="btnMemory" class="chip-btn" title="长期记忆">🧠 记忆</button>
        <button id="btnSkills" class="chip-btn" title="技能管理">🧩 技能</button>
      </div>
    </aside>

    <main id="chat">
      <div id="agents" class="agents hidden"></div>
      <div id="msgs" class="scroll"></div>
      <button id="btnBottom" class="fab hidden" title="回到底部">↓</button>

      <div id="composer">
        <div class="compose-row">
          <button id="btnAttach" class="icon" title="上传文件">📎</button>
          <button id="btnTpl" class="icon" title="快捷指令">💬</button>
          <button id="btnClusterTpl" class="icon hidden" title="分工模板">👥</button>
          <select id="mode" title="工具权限模式">
            <option value="chat">chat · 聊天（不改动电脑）</option>
            <option value="work">work · 命令需确认</option>
            <option value="boom">boom · 全自动</option>
          </select>
          <label class="chip"><input type="checkbox" id="tgFast"><i>⚡</i><span>极速</span></label>
          <label class="chip"><input type="checkbox" id="tgLocal"><i>🧠</i><span>本地</span></label>
          <label class="chip" title="网络搜索 / 深度研究"><input type="checkbox" id="tgSearch"><i>🌐</i><span>联网</span></label>
        </div>
        <div class="input-row">
          <textarea id="input" rows="1" placeholder="说点什么…（Enter 发送 / Shift+Enter 换行 / Esc 停止）"></textarea>
          <div class="compose-actions">
            <button id="btnRegen" class="icon" title="重新生成">↻</button>
            <button id="btnClear" class="icon" title="清空当前对话">🗑</button>
            <button id="btnSend" class="send">发送</button>
          </div>
        </div>
        <div class="compose-foot">
          <span id="busy" class="busy"></span>
          <span id="statusLine" class="status"></span>
          <span id="toolBar" class="toolbar" title="可用工具"></span>
        </div>
      </div>
    </main>
  </div>
</div>

<div id="toasts"></div>
<div id="modalRoot"></div>

<!-- 应用内远程桌面 / 完整控制台：桌面端本身是 WebView，再拉系统浏览器等于另开一个壳，
     会话、深色模式、快捷键全都对不上。这里直接在本页面里用 iframe 承载对端页面。 -->
<div id="rdRoot" class="hidden">
  <div id="rdBar">
    <button id="rdBack" class="rd-btn" title="返回（Esc）">← 返回</button>
    <b id="rdTitle">远程桌面</b>
    <span id="rdInfo"></span>
    <span class="grow"></span>
    <button id="rdOpen" class="rd-btn" title="在系统浏览器里打开">在新窗口打开</button>
    <button id="rdReload" class="rd-btn" title="重新加载">↻</button>
  </div>
  <iframe id="rdFrame" allow="clipboard-read; clipboard-write" referrerpolicy="no-referrer"></iframe>
</div>

<script>
/* 资源带上版本号再加载：WebView2 对 app.local 会走 HTTP 缓存，
   改了 app.js 却不生效、看着像"功能没做完"，就是缓存吃掉了新文件。
   版本号由客户端导航时带进来（index.html?v=3.1.3-xxxx）。 */
(function () {
  var m = location.search.match(/[?&]v=([^&]*)/);
  var v = m ? encodeURIComponent(m[1]) : Date.now();
  window.__uiVersion = v;

  function css(file, id) {
    var l = document.createElement('link');
    l.rel = 'stylesheet'; l.id = id;
    l.href = file + '?v=' + v;
    document.head.appendChild(l);
    return l;
  }
  css('style.css', 'baseCss');
  // 亮/暗模式各自一整套 CSS：里面的 body::before、.row、::-webkit-scrollbar 等
  // 都是全局选择器，两套同时生效会互相打架，所以只启用当前主题那一份。
  var themeLinks = {
    dark: css('theme-dark.css', 'themeDarkCss'),
    light: css('theme-light.css', 'themeLightCss')
  };
  // 启动先按本地记忆的主题亮一份，避免内核下发 boot 之前闪一下白底。
  var remembered = 'dark';
  try { remembered = localStorage.getItem('ds-theme') || 'dark'; } catch (e) { }
  window.__setThemeCss = function (t) {
    var dark = t === 'dark';
    // media='not all' 是跨浏览器最可靠的「停用整张样式表」方式，
    // disabled 一并设上双保险（WebView2 两者都认）。
    themeLinks.dark.media = dark ? 'all' : 'not all';
    themeLinks.light.media = dark ? 'not all' : 'all';
    themeLinks.dark.disabled = !dark;
    themeLinks.light.disabled = dark;
    try { localStorage.setItem('ds-theme', dark ? 'dark' : 'light'); } catch (e) { }
  };
  window.__setThemeCss(remembered);
  document.body.classList.toggle('dark', remembered === 'dark');
  document.body.classList.toggle('light', remembered !== 'dark');

  var sc = document.createElement('script');
  sc.src = 'app.js?v=' + v;
  document.body.appendChild(sc);
})();
</script>
</body>
</html>
