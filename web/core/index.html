<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deepsleep 内核版网页</title>
<link rel="stylesheet" href="../../ui/style.css">
</head>
<body class="light">
<div id="app">

  <!-- 自绘标题栏（36px）之上是客户端区域，这里画 macOS 顶部工具条 -->
  <header id="topbar">
    <div class="seg" id="seg">
      <button data-tab="0" class="on">Deepsleep</button>
      <button data-tab="1">Agent 集群</button>
    </div>
    <div class="tb-right">
      <a class="pill" href="../../" style="text-decoration:none">← 官网</a>
      <button id="btnUpdate" class="pill hidden"><span id="updateText">检查更新</span></button>
      <button id="btnTheme" class="icon" title="切换深浅色"><svg class="ico only-dark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg><svg class="ico only-light" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg></button>
      <button id="btnSettings" class="icon" title="设置"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
    </div>
  </header>

  <div id="main">
    <aside id="sidebar">
      <div class="side-top">
        <input id="convSearch" type="text" placeholder="搜索对话">
        <button id="btnNew" class="round" title="新建对话">＋</button>
      </div>
      <div id="convList" class="scroll"></div>
      <div class="side-bottom">
        <button id="btnMemory" class="chip-btn" title="长期记忆">记忆</button>
        <button id="btnSkills" class="chip-btn" title="技能管理">技能</button>
      </div>
    </aside>

    <main id="chat">
      <div id="agents" class="agents hidden"></div>
      <div id="msgs" class="scroll"></div>
      <button id="btnBottom" class="fab hidden" title="回到底部">↓</button>

      <div id="composer">
        <div class="compose-row">
          <button id="btnAttach" class="icon" title="上传文件"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 20h14"/></svg></button>
          <button id="btnTpl" class="icon" title="快捷指令"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7l4 5-4 5M12 17h7"/></svg></button>
          <button id="btnClusterTpl" class="icon hidden" title="分工模板"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0M16 6.5a3 3 0 0 1 0 5.8M17.5 19a5 5 0 0 0-2-4"/></svg></button>
          <select id="mode" title="工具权限模式">
            <option value="chat">chat · 聊天（可搜索 / 深度研究）</option>
            <option value="work">work · 命令需确认</option>
            <option value="boom">boom · 全自动</option>
          </select>
          <label class="chip"><input type="checkbox" id="tgFast"><span>极速</span></label>
          <label class="chip"><input type="checkbox" id="tgLocal"><span>本地</span></label>
          <label class="chip" title="网络搜索 / 深度研究"><input type="checkbox" id="tgSearch"><span>联网</span></label>
        </div>
        <div class="input-row">
          <textarea id="input" rows="1" placeholder="说点什么…（Enter 发送 / Shift+Enter 换行 / Esc 停止）"></textarea>
          <div class="compose-actions">
            <button id="btnRegen" class="icon" title="重新生成">↻</button>
            <button id="btnClear" class="icon" title="清空当前对话"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9.5 7V5h5v2M6.5 7l.9 12h9.2l.9-12"/></svg></button>
            <button id="btnSend" class="send">发送</button>
          </div>
        </div>
        <div class="compose-foot">
          <span id="busy" class="busy"></span>
          <span id="statusLine" class="status"></span>
        </div>
      </div>
    </main>
  </div>
</div>

<div id="toasts"></div>
<div id="modalRoot"></div>
<script src="core-bridge.js"></script>
<script src="../../ui/app.js"></script>
</body>
</html>
