<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>远程桌面 · deepsleep</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#111; color:#eee; overflow:hidden;
    font:13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  #bar { position:fixed; top:0; left:0; right:0; height:44px; display:flex; align-items:center; gap:9px;
    padding:0 11px; background:rgba(28,28,30,.94); backdrop-filter:blur(14px); z-index:10;
    border-bottom:1px solid #3a3a3c; }
  #bar .grow { flex:1; }
  #bar b { font-size:13.5px; font-weight:600; }
  select, button { background:#3a3a3c; color:#f2f2f7; border:0; border-radius:9px; padding:6px 10px;
    font-size:12.5px; cursor:pointer; font-family:inherit; }
  button:hover, select:hover { background:#48484a; }
  button.on { background:#0a84ff; color:#fff; }
  #stat { color:#98989d; font-size:11.5px; min-width:120px; text-align:right; }
  #stage { position:absolute; inset:44px 0 0 0; overflow:auto; display:flex; align-items:flex-start;
    justify-content:center; cursor:crosshair; }
  #stage.fit img { max-width:100%; max-height:100%; }
  #screen { display:block; width:auto; height:auto; user-select:none; -webkit-user-drag:none; }
  body.immersive #bar { transform:translateY(-100%); transition:transform .2s; }
  body.immersive:hover #bar { transform:none; }
  body.immersive #stage { inset:0; }
  #tip { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); background:rgba(28,28,30,.9);
    padding:7px 14px; border-radius:20px; font-size:12px; color:#c7c7cc; pointer-events:none;
    transition:opacity .4s; }
</style>
</head>
<body>
<div id="bar">
  <b>🖥 远程桌面</b>
  <span id="who"></span>
  <span class="grow"></span>
  <select id="quality">
    <option value="1280">标准 1280</option>
    <option value="1600">清晰 1600</option>
    <option value="1920">原画 1920</option>
    <option value="960">省流 960</option>
  </select>
  <select id="fps">
    <option value="8">8 帧</option>
    <option value="4">4 帧</option>
    <option value="12">12 帧</option>
    <option value="20">20 帧</option>
  </select>
  <button id="btnFit">适应窗口</button>
  <button id="btnFull">全屏</button>
  <button id="btnHide">沉浸</button>
  <span id="stat"></span>
</div>
<div id="stage" class="fit"><img id="screen" alt=""></div>
<div id="tip">点击画面开始操作 · Ctrl+Alt+Del 这类系统键在浏览器里发不过去</div>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var q = new URLSearchParams(location.search);
  var token = q.get('t') || '';
  if (!token && location.hash) {
    var m = location.hash.match(/[#&?]t=([^&]+)/);
    if (m) token = decodeURIComponent(m[1]);
  }
  var img = $('#screen'), stage = $('#stage'), stat = $('#stat');
  var w = 1280, fps = 8, sent = 0, moved = 0;

  if (!token) {
    document.body.innerHTML = '<div style="padding:40px;color:#f2f2f7;font-size:15px">' +
      '缺少配对令牌：请从「超级连接」里打开这个页面。</div>';
    return;
  }

  function stream() {
    img.src = '/api/rd/stream?t=' + encodeURIComponent(token) + '&w=' + w + '&fps=' + fps + '&r=' + Date.now();
  }

  function send(msg) {
    try {
      fetch('/api/rd/input', {
        method: 'POST',
        headers: { 'X-DS-Token': token, 'Content-Type': 'application/json' },
        body: JSON.stringify(msg),
        keepalive: true
      }).catch(function () { });
    } catch (e) { }
  }

  function norm(e) {
    var r = img.getBoundingClientRect();
    if (r.width <= 0 || r.height <= 0) return null;
    var x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    if (x < 0 || x > 1 || y < 0 || y > 1) return null;
    return { x: Math.round(x * 10000) / 10000, y: Math.round(y * 10000) / 10000 };
  }

  stage.addEventListener('mousemove', function (e) {
    var p = norm(e);
    if (!p) return;
    var t = Date.now();
    if (t - moved < 45) return;
    moved = t;
    send({ type: 'move', x: p.x, y: p.y });
  });

  stage.addEventListener('mousedown', function (e) {
    e.preventDefault();
    var p = norm(e);
    if (p) send({ type: 'move', x: p.x, y: p.y });
    var btn = e.button === 2 ? 'right' : (e.button === 1 ? 'middle' : 'left');
    send({ type: 'down', button: btn });
  });

  window.addEventListener('mouseup', function (e) {
    var btn = e.button === 2 ? 'right' : (e.button === 1 ? 'middle' : 'left');
    send({ type: 'up', button: btn });
  });

  stage.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  stage.addEventListener('wheel', function (e) {
    e.preventDefault();
    send({ type: 'wheel', dy: e.deltaY });
  }, { passive: false });

  window.addEventListener('keydown', function (e) {
    if (e.keyCode === 0) return;
    if (e.ctrlKey && e.altKey && e.keyCode === 46) return;   // Ctrl+Alt+Del 发不过去
    e.preventDefault();
    send({ type: 'key', vk: e.keyCode, down: true });
  });
  window.addEventListener('keyup', function (e) {
    if (e.keyCode === 0) return;
    if (e.ctrlKey && e.altKey && e.keyCode === 46) return;
    e.preventDefault();
    send({ type: 'key', vk: e.keyCode, down: false });
  });

  // 手机 / 平板：触摸当作鼠标
  stage.addEventListener('touchstart', function (e) {
    e.preventDefault();
    var t = e.touches[0], p = norm(t);
    if (p) { send({ type: 'move', x: p.x, y: p.y }); send({ type: 'down', button: 'left' }); }
  }, { passive: false });
  stage.addEventListener('touchmove', function (e) {
    e.preventDefault();
    var t = e.touches[0], p = norm(t);
    if (p) send({ type: 'move', x: p.x, y: p.y });
  }, { passive: false });
  stage.addEventListener('touchend', function (e) {
    e.preventDefault();
    send({ type: 'up', button: 'left' });
  }, { passive: false });

  $('#quality').addEventListener('change', function () { w = +this.value; stream(); });
  $('#fps').addEventListener('change', function () { fps = +this.value; stream(); });
  $('#btnFit').addEventListener('click', function () {
    stage.classList.toggle('fit');
    this.classList.toggle('on', stage.classList.contains('fit'));
  });
  $('#btnFull').addEventListener('click', function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(function () { });
  });
  $('#btnHide').addEventListener('click', function () {
    document.body.classList.toggle('immersive');
    this.classList.toggle('on', document.body.classList.contains('immersive'));
    setTimeout(function () { document.getElementById('tip').style.opacity = 0; }, 2500);
  });

  setInterval(function () {
    var n = Date.now();
    if (img.naturalWidth > 0) {
      stat.textContent = img.naturalWidth + '×' + img.naturalHeight + ' · ' + w + 'px/' + fps + 'fps';
    }
  }, 1500);
  img.addEventListener('error', function () {
    stat.textContent = '画面断了，正在重连…';
    setTimeout(stream, 2500);
  });

  stage.classList.add('fit');
  $('#btnFit').classList.add('on');
  fetch('/api/rd/info?t=' + encodeURIComponent(token)).then(function (r) { return r.json(); })
    .then(function (j) {
      if (j && j.name) $('#who').textContent = '（' + j.name + '）';
      if (j && j.available === false) {
        stat.textContent = '这台机器不支持远程桌面';
        img.alt = '不支持';
      }
    }).catch(function () { });
  stream();
})();
</script>
</body>
</html>
